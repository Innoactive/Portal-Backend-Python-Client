name: "Continuous integration"

on:
  - push
  - pull_request

jobs:
  build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup python version
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install dependecies
        run: uv sync --locked
      - name: Run tests
        run: uv run pytest
